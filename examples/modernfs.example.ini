#---------------------------------------
# ModernFS 配置示例
# 复制为 modernfs.ini 后按需修改：
#   cp examples/modernfs.example.ini modernfs.ini
# 启动时通过 -file 指定配置文件。
#---------------------------------------


# 监听端口
port=8080


# 共享根目录，多个目录用 | 分隔
# 带空格的路径用引号包住，例如 path="C:\My Files\share"
path=/srv/chfs/public | /srv/chfs/team


# IP 过滤，留空表示不限制
# 支持 CIDR（192.168.1.0/24）和前缀通配（10.0.*）
allow=


# 用户操作日志目录，留空表示禁用日志
log=/var/log/modernfs


# 网页标题
html.title=ModernFS 文件共享


# 顶部公告，支持 HTML（整段用反引号包裹）
html.notice=内部资料，请勿外传


# 图片缩略图预览
image.preview=true


# 目录下载策略：enable 允许 / leaf 仅叶子目录 / disable 禁止
folder.download=enable


# ICP 备案号与公安备案号，显示在页面底部，可留空
html.icp=
html.police=


# HTTPS：两个都填写才启用，此时端口应设为 443
ssl.cert=
ssl.key=


# 会话有效期，单位分钟
session.timeout=60


# 删除模式
#   1 = 移到系统回收站
#   2 = 移到程序专属回收站（推荐，可在 /chfs/trash 恢复）
#   3 = 永久删除
file.remove=2


#---------------------------------------
# 账户配置
#   账号名为节名，访客固定为 guest
#   password      密码，guest 可留空
#   rule.default  默认权限：r 只读 / w 可写 / d 完全权限
#   rule.none     禁止访问的目录
#   rule.r        只读目录
#   rule.w        可写目录
#   rule.d        完全权限目录
#   多个目录用 | 分隔
#---------------------------------------

[guest]
password=
rule.default=
rule.r=/srv/chfs/public

[admin]
password=change-me
rule.default=rwd
