name: import-source-v2

on:
  push:
    paths:
      - '.github/workflows/import-source-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and extract archive
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/repo.zip "https://aka.doubaocdn.com/s/NhJw4YJcQj"
          ls -lh /tmp/repo.zip
          unzip -o /tmp/repo.zip -d .
          rm -f .github/workflows/build.yml
          find . -path ./.git -prune -o -type f -print | sort

      - name: Commit source tree
        run: |
          set -euo pipefail
          git config user.name "fabie250"
          git config user.email "fabie250@users.noreply.github.com"
          git add -A
          git commit -m "chore: import ModernFS source tree [skip ci]"
          git push
