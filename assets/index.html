<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>文件空间</title>
<script>
(function () {
  try {
    var m = localStorage.getItem('mfs-theme') || 'auto';
    if (m !== 'auto') document.documentElement.dataset.theme = m;
    window.__mfsTheme = m;
  } catch (e) {}
})();
</script>
<link rel="icon" href="/asset/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/asset/app.css?v=20261119d">
</head>
<body>
<div class="ambient"></div>

<div class="shell">
  <aside class="rail">
    <div class="brand">
      <img class="logo" src="/asset/logo.svg" alt="">
      <div class="brand-text">
        <h1 id="siteTitle">文件空间</h1>
        <span class="brand-sub">文件共享空间</span>
      </div>
    </div>

    <nav class="nav">
      <a href="#/" data-view="files" class="nav-item active">
        <svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        <span>文件</span>
      </a>
      <a href="#/trash" data-view="trash" class="nav-item">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
        <span>回收站</span>
      </a>
      <a href="#/shares" data-view="shares" class="nav-item">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.7 10.6l6.6-3.2M8.7 13.4l6.6 3.2"/></svg>
        <span>我的分享</span>
      </a>
    </nav>

    <div class="side-info">
      <div class="side-line"><span>WebDAV 地址</span><code>/webdav</code></div>
      <div class="side-line"><span>版本号</span><code id="verText">-</code></div>
    </div>
  </aside>

  <div class="workspace">
    <header class="appbar">
      <div class="mobile-brand">
        <img class="logo" src="/asset/logo.svg" alt="">
        <span data-site-title>文件空间</span>
      </div>
      <div class="page-title">
        <span class="kicker" data-site-title>文件空间</span>
        <h2 id="pageHeading">文件</h2>
      </div>

      <div class="search">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="搜索当前目录" autocomplete="off" aria-label="搜索文件">
        <button id="searchScope" class="scope active" type="button" aria-label="切换搜索范围">当前目录</button>
      </div>

      <div class="top-actions">
        <button id="themeBtn" class="iconbtn" type="button" title="切换外观"></button>
        <button id="userBtn" class="userbtn guest" type="button" title="登录后可上传、删除和分享文件">
          <span class="avatar" id="userAvatar"></span>
          <span class="user-text">
            <span class="user-name" id="userName">登录</span>
            <span class="user-sub" id="userSub">游客仅可浏览</span>
          </span>
        </button>
      </div>
    </header>

    <div class="notice" id="noticeBar" hidden></div>
    <div class="guest-bar" id="guestBar" hidden>
      <span class="guest-tip">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
        游客模式：可查看和下载
      </span>
      <button type="button" class="linkbtn" id="guestLogin">立即登录</button>
    </div>

    <main class="main">
      <div class="toolbar">
        <div class="crumbs" id="breadcrumb"></div>
        <div class="tools" id="fileTools">
          <button id="btnUpload" class="btn primary" type="button">
            <svg class="ic" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg><span>上传文件</span>
          </button>
          <button id="btnUploadDir" class="btn" type="button" title="上传整个文件夹（保留目录结构）">
            <svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M12 12v5M9 14.5l3-2.5 3 2.5"/></svg><span>上传文件夹</span>
          </button>
          <button id="btnNewDir" class="btn" type="button" title="在当前文件夹新建文件夹" aria-label="新建文件夹">
            <svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M12 11v6M9 14h6"/></svg><span>新建文件夹</span>
          </button>
          <button id="btnNewText" class="btn" type="button" title="新建一个纯文本文件" aria-label="新建文本文件">
            <svg class="ic" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg><span>新建文本文件</span>
          </button>
          <button id="btnRefresh" class="iconbtn" type="button" title="刷新文件列表" aria-label="刷新文件列表">
            <svg class="ic" viewBox="0 0 24 24"><path d="M20 12a8 8 0 10-2.4 5.7M20 4v6h-6"/></svg>
          </button>
          <div class="seg" id="viewToggle">
            <button data-view="list" class="active" title="列表视图" aria-label="列表视图"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
            <button data-view="grid" title="网格视图" aria-label="网格视图"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg></button>
          </div>
        </div>
      </div>

      <div class="panel" id="panel">
        <div class="panel-head" id="panelHead" hidden>
          <span id="searchResultLabel"></span>
          <button class="linkbtn" id="btnClearSearch" type="button">清除搜索</button>
        </div>

        <div id="listView" class="listview">
          <table class="filetable">
            <thead>
              <tr>
                <th class="col-name" data-sort="name">名称</th>
                <th class="col-size" data-sort="size">大小</th>
                <th class="col-time" data-sort="time">修改时间</th>
                <th class="col-act">操作</th>
              </tr>
            </thead>
            <tbody id="fileBody"></tbody>
          </table>
        </div>

        <div id="gridView" class="gridview" hidden></div>
        <div id="trashView" class="listview" hidden></div>
        <div id="sharesView" class="listview" hidden></div>

        <div id="loadingState" class="empty loading" hidden>
          <span class="empty-icon">
            <svg class="spin" viewBox="0 0 24 24"><path d="M12 3a9 9 0 109 9"/></svg>
          </span>
          <p>正在加载…</p>
          <p>请稍候，文件列表马上出现</p>
        </div>
        <div class="empty" id="emptyState" hidden>
          <span class="empty-icon" id="emptyIcon">
            <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
          </span>
          <p id="emptyTitle">这个文件夹还是空的</p>
          <span id="emptyTip">把文件拖到这里，或点上方“上传文件”</span>
        </div>

        <div class="panel-foot" id="panelFoot"></div>
      </div>
    </main>
  </div>
</div>

<footer class="site-footer">
  <div class="footer-brand">ModernFS <span id="footerVersion">v1.0.0</span></div>
  <div class="footer-legal">
    <a id="icpLink" hidden href="https://beian.miit.gov.cn/" target="_blank" rel="noopener"></a>
    <span id="icpEmpty" class="legal-empty">备案号待填写</span>
    <span class="footer-sep" hidden>·</span>
    <a id="policeLink" hidden href="https://beian.mps.gov.cn/" target="_blank" rel="noopener"></a>
  </div>
</footer>

<nav class="tabbar">
  <a href="#/" data-view="files" class="nav-item active">
    <svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    <span>文件</span>
  </a>
  <a href="#/trash" data-view="trash" class="nav-item">
    <svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
    <span>回收站</span>
  </a>
  <a href="#/shares" data-view="shares" class="nav-item">
    <svg class="ic" viewBox="0 0 24 24"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.7 10.6l6.6-3.2M8.7 13.4l6.6 3.2"/></svg>
    <span>分享</span>
  </a>
</nav>

<div class="dropmask" id="dropmask">
  <div class="dropbox">
    <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
    <p>松开鼠标，上传到 <b id="dropPath">/</b></p>
  </div>
</div>

<div class="uploads" id="uploads"></div>
<div class="toasts" id="toasts"></div>

<!-- 登录 -->
<div class="modal" id="loginModal">
  <div class="modal-card narrow">
    <div class="modal-head"><h3>登录文件空间</h3><button class="x" data-close aria-label="关闭">✕</button></div>
    <div class="modal-body">
      <p class="modal-desc">登录后可以上传、删除、重命名和分享文件；游客只能查看和下载。</p>
      <label class="field"><span>用户名</span><input id="loginUser" autocomplete="username" placeholder="请输入用户名"></label>
      <label class="field"><span>密码</span><input id="loginPwd" type="password" autocomplete="current-password" placeholder="请输入密码"></label>
      <p class="hint" id="loginHint"></p>
    </div>
    <div class="modal-foot"><button class="btn" data-close>取消</button><button class="btn primary" id="btnLogin">登录</button></div>
  </div>
</div>

<!-- 通用输入 -->
<div class="modal" id="promptModal">
  <div class="modal-card narrow">
    <div class="modal-head"><h3 id="promptTitle">新建文件夹</h3><button class="x" data-close aria-label="关闭">✕</button></div>
    <div class="modal-body">
      <label class="field" id="promptField"><span id="promptLabel">名称</span><input id="promptInput"></label>
      <label class="field" id="textField" hidden><span>内容</span><textarea id="promptText" rows="10"></textarea></label>
      <p class="hint" id="promptHint"></p>
    </div>
    <div class="modal-foot"><button class="btn" data-close>取消</button><button class="btn primary" id="btnPromptOk">确定</button></div>
  </div>
</div>

<!-- 确认 -->
<div class="modal" id="confirmModal">
  <div class="modal-card narrow">
    <div class="modal-head"><h3 id="confirmTitle">确认</h3><button class="x" data-close aria-label="关闭">✕</button></div>
    <div class="modal-body"><p class="confirm-text" id="confirmText"></p></div>
    <div class="modal-foot"><button class="btn" data-close>取消</button><button class="btn danger" id="btnConfirm">确定</button></div>
  </div>
</div>

<!-- 预览 -->
<div class="modal" id="previewModal">
  <div class="modal-card wide">
    <div class="modal-head">
      <h3 id="previewTitle">预览</h3>
      <div class="preview-actions">
        <button class="btn" id="btnPreviewEdit" type="button" hidden aria-label="编辑文本文件">编辑</button>
        <button class="iconbtn" id="btnPrevFile" title="上一个" aria-label="上一个文件"><svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="iconbtn" id="btnNextFile" title="下一个" aria-label="下一个文件"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <a class="iconbtn" id="btnPreviewDownload" title="下载" aria-label="下载文件"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg></a>
        <button class="x" data-close aria-label="关闭">✕</button>
      </div>
    </div>
    <div class="modal-body preview-body" id="previewBody"></div>
  </div>
</div>

<!-- 分享 / 二维码 -->
<div class="modal" id="shareModal">
  <div class="modal-card narrow">
    <div class="modal-head"><h3>创建分享链接</h3><button class="x" data-close aria-label="关闭">✕</button></div>
    <div class="modal-body">
      <p class="modal-desc">拿到链接的人无需登录即可访问；设置密码和有效期会更安全。</p>
      <p class="share-name" id="shareName"></p>
      <label class="field"><span>有效期</span>
        <select id="shareTTL">
          <option value="1h">1 小时</option>
          <option value="1d" selected>1 天</option>
          <option value="7d">7 天</option>
          <option value="0">永久</option>
        </select>
      </label>
      <label class="field"><span>访问密码（可选）</span><input id="sharePwd" placeholder="留空则无需密码"></label>
      <div id="shareResult" class="share-result" hidden>
        <label class="field"><span>分享链接</span><input id="shareUrl" readonly></label>
        <div class="qr-wrap"><img id="shareQR" alt="二维码"><button class="btn" id="btnCopyShare" type="button" aria-label="复制分享链接">复制链接</button></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>关闭</button>
      <button class="btn primary" id="btnShareCreate">生成链接</button>
    </div>
  </div>
</div>

<script src="/asset/app.js?v=20261119d"></script>
</body>
</html>
